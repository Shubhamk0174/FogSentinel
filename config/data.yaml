    binary_label: "malicious"
    multi_label: "gafgyt.combo"
  gafgyt.junk:
    file: "gafgyt/junk.csv"
    binary_label: "malicious"
    multi_label: "gafgyt.junk"
  gafgyt.scan:
    file: "gafgyt/scan.csv"
    binary_label: "malicious"
    multi_label: "gafgyt.scan"
  gafgyt.tcp:
    file: "gafgyt/tcp.csv"
    binary_label: "malicious"
    multi_label: "gafgyt.tcp"
  gafgyt.udp:
    file: "gafgyt/udp.csv"
    binary_label: "malicious"
    multi_label: "gafgyt.udp"
  mirai.ack:
    file: "mirai/ack.csv"
    binary_label: "malicious"
    multi_label: "mirai.ack"
  mirai.scan:
    file: "mirai/scan.csv"
    binary_label: "malicious"
    multi_label: "mirai.scan"
  mirai.syn:
    file: "mirai/syn.csv"
    binary_label: "malicious"
    multi_label: "mirai.syn"
  mirai.udp:
    file: "mirai/udp.csv"
    binary_label: "malicious"
    multi_label: "mirai.udp"
  mirai.udpplain:
    file: "mirai/udpplain.csv"
    binary_label: "malicious"
    multi_label: "mirai.udpplain"

sampling:
  samples_per_class: 4000
  demo_benign_count: 5
  demo_attack_per_class: 5
