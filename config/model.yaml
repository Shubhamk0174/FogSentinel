mlp:
  hidden_layer_sizes: [64, 32]
  activation: "relu"
  solver: "adam"
  alpha: 0.0001
  batch_size: 256
  learning_rate: "adaptive"
  learning_rate_init: 0.001
  max_iter: 100
  early_stopping: true
  n_iter_no_change: 10
  random_state: 42

random_forest:
  n_estimators: 100
  max_depth: 20
  random_state: 42
  n_jobs: -1

logistic_regression:
  max_iter: 500
  random_state: 42

thresholds:
  binary_malicious_threshold: 0.50
  confidence_high: 0.85

actions:
  benign: "ALLOW"
  malicious: "QUARANTINE_RECOMMENDED"

